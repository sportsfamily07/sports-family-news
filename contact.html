<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Contact Sports Family News for questions, feedback and sports news inquiries."
  >

  <title>Contact Us | Sports Family News</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="contact-page">

    <div class="contact-header">

      <h1>Contact Us</h1>

      <p>
        We'd love to hear from you!
        Contact Sports Family News with your
        questions, feedback or suggestions.
      </p>

    </div>

    <section class="contact-card">

      <h2>Send Us a Message</h2>

      <form id="contact-form">

        <div class="form-group">

          <label for="contact-name">
            Your Name
          </label>

          <input
            type="text"
            id="contact-name"
            name="name"
            placeholder="Enter your name"
            required
          >

        </div>

        <div class="form-group">

          <label for="contact-email">
            Email Address
          </label>

          <input
            type="email"
            id="contact-email"
            name="email"
            placeholder="Enter your email"
            required
          >

        </div>

        <div class="form-group">

          <label for="contact-subject">
            Subject
          </label>

          <input
            type="text"
            id="contact-subject"
            name="subject"
            placeholder="Enter message subject"
            required
          >

        </div>

        <div class="form-group">

          <label for="contact-message">
            Your Message
          </label>

          <textarea
            id="contact-message"
            name="message"
            rows="6"
            placeholder="Write your message..."
            required
          ></textarea>

        </div>

        <button type="submit">
          Send Message
        </button>

      </form>

      <p class="contact-note">
        Please complete all fields before sending.
      </p>

    </section>

    <a class="back-home" href="index.html">
      ← Back to Home
    </a>

  </main>
  
  <script src="contact.js"></script>

</body>

</html>
